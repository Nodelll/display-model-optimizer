name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and run automated checks
        run: python3 build.py
      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: display-model-optimizer-mc26.3
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
